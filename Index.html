<!doctype html>
<html lang="am"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ABDEPA CITY</title>
<style>
:root{--bg:#10121a;--tx:#f4f1e8;--ac:#ffc233;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--bg:#10121a;--tx:#f4f1e8;--ac:#ffc233}
:root[data-theme="dark"]{--bg:#10121a;--tx:#f4f1e8;--ac:#ffc233}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#t{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font-weight:900;font-size:22px;letter-spacing:.5px;text-shadow:0 2px 6px #000a}
#t b{color:var(--ac)}
#sp{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);font-weight:800;font-size:20px;text-shadow:0 2px 6px #000a}
#h{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:14px;transition:opacity 1s;text-shadow:0 2px 6px #000}
#js{position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid #fff7;display:none}
#js i{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fffa}
#e{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);padding:16px 22px;border:0;border-radius:16px;background:var(--ac);color:#15120a;font-size:18px;font-weight:800;display:none}
</style></head><body>
<div id="t">ABDEPA <b>CITY</b></div><div id="sp"></div>
<div id="h">ግራ ጎን ጣት: ተንቀሳቀስ · ቀኝ ጎን ጣት: ካሜራ አዙር</div>
<div id="js"><i></i></div><button id="e">🚗 ግባ</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene(),SKY=0x8ec3f0;
S.background=new THREE.Color(SKY);S.fog=new THREE.Fog(SKY,90,330);
const C=new THREE.PerspectiveCamera(65,1,.1,700);
S.add(new THREE.HemisphereLight(0xffffff,0x667788,1));
const sun=new THREE.DirectionalLight(0xfff0c8,.7);sun.position.set(80,150,60);S.add(sun);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
rs();addEventListener('resize',rs);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

/* ---- ከተማ ---- */
const N=10,BLK=56,RD=18,CELL=BLK+RD,SIZE=N*CELL;
const grass=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),M(0x4a7c4a));
grass.rotation.x=-Math.PI/2;grass.position.y=-.1;S.add(grass);
const road=new THREE.Mesh(new THREE.PlaneGeometry(SIZE+RD,SIZE+RD),M(0x3b3f46));
road.rotation.x=-Math.PI/2;road.position.set(SIZE/2,0,SIZE/2);S.add(road);
const dc=document.createElement('canvas');dc.width=8;dc.height=32;
const dx=dc.getContext('2d');dx.fillStyle='#fff';dx.fillRect(0,0,8,16);
const DT=new THREE.CanvasTexture(dc);DT.wrapS=DT.wrapT=THREE.RepeatWrapping;DT.repeat.set(1,SIZE/10);
const DM=new THREE.MeshBasicMaterial({map:DT,transparent:true});
for(let i=0;i<=N;i++)for(const rot of [0,Math.PI/2]){
  const g=new THREE.Group(),l=new THREE.Mesh(new THREE.PlaneGeometry(.5,SIZE),DM);
  l.rotation.x=-Math.PI/2;g.add(l);g.rotation.y=rot;
  g.position.set(rot?SIZE/2:i*CELL,.03,rot?i*CELL:SIZE/2);S.add(g);
}
const wc=document.createElement('canvas');wc.width=wc.height=64;const wx=wc.getContext('2d');
wx.fillStyle='#fff';wx.fillRect(0,0,64,64);
for(let i=0;i<4;i++)for(let j=0;j<4;j++){wx.fillStyle=rnd()<.4?'#ffe9a0':'#6f8296';wx.fillRect(i*16+3,j*16+3,10,10)}
const WT=new THREE.CanvasTexture(wc);WT.wrapS=WT.wrapT=THREE.RepeatWrapping;
const B=[],pal=[0xc9b79c,0xb8c4d0,0xd9a5a0,0xa9c8b0,0xe0d6c0,0x9aa7b8];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const cx=(i+.5)*CELL,cz=(j+.5)*CELL,lot=(BLK-6)/2;
  const sl=box(BLK,.4,BLK,0x8d8d88);sl.position.set(cx,.2,cz);S.add(sl);
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
    const lx=cx-BLK/2+3+lot/2+a*lot,lz=cz-BLK/2+3+lot/2+b*lot;
    if(rnd()<.14){
      const g=box(lot-2,.2,lot-2,0x4f8a4a);g.position.set(lx,.5,lz);S.add(g);
      const tr=new THREE.Mesh(new THREE.ConeGeometry(2,6,6),M(0x2f6b3a));tr.position.set(lx,3.5,lz);S.add(tr);
      continue;
    }
    const w=lot-2-rnd()*4,d=lot-2-rnd()*4,h=8+rnd()*rnd()*70;
    const t=WT.clone();t.needsUpdate=true;t.repeat.set(w/8,h/8);
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:pal[Math.floor(rnd()*pal.length)],map:t}));
    m.position.set(lx,.4+h/2,lz);S.add(m);
    B.push({x0:lx-w/2,x1:lx+w/2,z0:lz-d/2,z1:lz+d/2});
  }
}

/* ---- መኪናዎች ---- */
function mkCar(col){
  const g=new THREE.Group();
  const b=box(2,.7,4.2,col);b.position.y=.7;g.add(b);
  const c=box(1.7,.6,2.1,0xcfe6ff);c.position.set(0,1.35,-.2);g.add(c);
  for(const [x,z] of [[-1,1.3],[1,1.3],[-1,-1.3],[1,-1.3]]){
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,12),M(0x111111));
    w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w);
  }
  S.add(g);return g;
}
const cars=[0x1e6fd9,0xe63946,0xf4d35e,0x2a9d8f].map((c,i)=>{
  const o={g:mkCar(c),x:CELL+(i%2?4:-4),z:CELL+14+i*14,h:0,v:0};
  o.g.position.set(o.x,0,o.z);return o;
});

/* ---- አብዲፓ ---- */
const SKIN=0x8d5a3b,JAC=0x2f6b3a,WRAP=0xd23b3b;
const P=new THREE.Group();S.add(P);
const torso=box(.8,.9,.42,JAC);torso.position.y=1.12;P.add(torso);
for(const x of [-.4,.4]){const s=box(.06,.9,.44,0xffc233);s.position.set(x,1.12,0);P.add(s)}
function leg(x){const g=new THREE.Group();g.position.set(x,.9,0);
  const s=box(.24,.45,.26,0x15171c);s.position.y=-.225;g.add(s);
  const k=box(.17,.34,.18,SKIN);k.position.y=-.62;g.add(k);
  const f=box(.2,.12,.36,0xffffff);f.position.set(0,-.84,.06);g.add(f);P.add(g);return g}
function arm(x){const g=new THREE.Group();g.position.set(x,1.5,0);
  const s=box(.2,.62,.22,JAC);s.position.y=-.31;g.add(s);
  const h=box(.16,.16,.16,SKIN);h.position.y=-.7;g.add(h);P.add(g);return g}
const lL=leg(-.17),lR=leg(.17),aL=arm(-.52),aR=arm(.52);
const head=new THREE.Mesh(new THREE.SphereGeometry(.21,12,10),M(SKIN));head.position.y=1.76;P.add(head);
const wrap=new THREE.Mesh(new THREE.SphereGeometry(.235,12,10,0,Math.PI*2,0,Math.PI*.55),M(WRAP));wrap.position.y=1.77;P.add(wrap);
const knot=box(.13,.13,.13,WRAP);knot.position.set(0,1.93,-.14);P.add(knot);
const nc=document.createElement('canvas');nc.width=256;nc.height=64;const nx=nc.getContext('2d');
nx.font='bold 40px system-ui';nx.textAlign='center';nx.lineWidth=6;nx.strokeStyle='#000';nx.fillStyle='#fff';
nx.strokeText('ABDEPA',128,46);nx.fillText('ABDEPA',128,46);
const tag=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(nc)}));
tag.scale.set(1.8,.45,1);tag.position.y=2.45;P.add(tag);
const p={x:CELL+4,z:CELL+6,h:0};let mode=null,cy=0,walkT=0;

/* ---- መቆጣጠሪያ ---- */
let jx=0,jy=0,sid=null,so=null,cid=null,cl=0;const keys={},js=$('js');
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyE')toggle()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('pointerdown',e=>{
  if(e.target.id==='e')return;
  if(e.clientX<innerWidth/2&&sid===null){sid=e.pointerId;so={x:e.clientX,y:e.clientY};
    js.style.cssText='display:block;left:'+(so.x-50)+'px;top:'+(so.y-50)+'px';}
  else if(cid===null){cid=e.pointerId;cl=e.clientX}
});
addEventListener('pointermove',e=>{
  if(e.pointerId===sid){let dx=(e.clientX-so.x)/50,dy=(e.clientY-so.y)/50;const m=Math.hypot(dx,dy);
    if(m>1){dx/=m;dy/=m}jx=dx;jy=-dy;js.firstChild.style.transform='translate('+dx*30+'px,'+dy*30+'px)'}
  else if(e.pointerId===cid){cy-=(e.clientX-cl)*.006;cl=e.clientX}
});
const up=e=>{if(e.pointerId===sid){sid=null;jx=jy=0;js.style.display='none'}if(e.pointerId===cid)cid=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
$('e').addEventListener('pointerdown',e=>{e.stopPropagation();toggle()});
setTimeout(()=>$('h').style.opacity=0,7000);

function near(){let best=null,bd=36;for(const c of cars){const d=(c.x-p.x)**2+(c.z-p.z)**2;if(d<bd){bd=d;best=c}}return best}
function toggle(){
  if(mode){const c=mode;mode=null;p.x=c.x-Math.cos(c.h)*3;p.z=c.z+Math.sin(c.h)*3;p.h=c.h;c.v=0;P.visible=true}
  else{const c=near();if(c){mode=c;P.visible=false}}
}
function hit(o,r){
  o.x=Math.max(3,Math.min(SIZE-3,o.x));o.z=Math.max(3,Math.min(SIZE-3,o.z));let h=false;
  for(const b of B){
    const qx=Math.max(b.x0,Math.min(o.x,b.x1)),qz=Math.max(b.z0,Math.min(o.z,b.z1));
    const dx=o.x-qx,dz=o.z-qz,d2=dx*dx+dz*dz;
    if(d2<r*r){const d=Math.sqrt(d2)||.001,k=(r-d)/d;o.x+=dx*k;o.z+=dz*k;h=true}
  }
  return h;
}
const tp=new THREE.Vector3();let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1e3);last=now;
  const ix=jx||((keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0));
  const iy=jy||((keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0));
  let sp=0;
  if(mode){
    const c=mode;
    c.v+=iy*(iy>0?20:24)*dt;c.v*=1-Math.min(1,(iy?.9:1.8)*dt);
    c.v=Math.max(-10,Math.min(34,c.v));
    c.h-=ix*1.8*dt*Math.max(-1,Math.min(1,c.v/6));
    c.x+=Math.sin(c.h)*c.v*dt;c.z+=Math.cos(c.h)*c.v*dt;
    if(hit(c,2.3))c.v*=.4;
    c.g.position.set(c.x,0,c.z);c.g.rotation.y=c.h;
    sp=Math.abs(c.v);p.x=c.x;p.z=c.z;
    if(cid===null){let dh=c.h-cy;dh=Math.atan2(Math.sin(dh),Math.cos(dh));cy+=dh*Math.min(1,2.5*dt)}
  }else{
    const mx0=Math.sin(cy)*iy-Math.cos(cy)*ix,mz0=Math.cos(cy)*iy+Math.sin(cy)*ix;
    const mg=Math.min(1,Math.hypot(mx0,mz0));
    if(mg>.05){
      const s=6.5*mg*(mg>.9?1.35:1),l=Math.hypot(mx0,mz0),mx=mx0/l,mz=mz0/l;
      p.x+=mx*s*dt;p.z+=mz*s*dt;
      let dh=Math.atan2(mx,mz)-p.h;dh=Math.atan2(Math.sin(dh),Math.cos(dh));p.h+=dh*Math.min(1,12*dt);
      walkT+=dt*s*1.3;sp=s;
    }
    hit(p,.5);P.position.set(p.x,0,p.z);P.rotation.y=p.h;
    const sw=sp>0?Math.sin(walkT)*Math.min(1,sp/4):0;
    lL.rotation.x=sw*.9;lR.rotation.x=-sw*.9;aL.rotation.x=-sw*.8;aR.rotation.x=sw*.8;
  }
  const dist=mode?11:7,hh=mode?5:4;
  tp.set(p.x-Math.sin(cy)*dist,hh,p.z-Math.cos(cy)*dist);
  C.position.lerp(tp,1-Math.exp(-10*dt));C.lookAt(p.x,1.5,p.z);
  $('e').style.display=(mode||near())?'block':'none';
  $('e').textContent=mode?'🚶 ውጣ':'🚗 ግባ';
  $('sp').textContent=mode?Math.round(sp*3.6)+' km/h':'';
  R.render(S,C);requestAnimationFrame(frame);
}
C.position.set(p.x,4,p.z-7);requestAnimationFrame(frame);
</script></body></html>
